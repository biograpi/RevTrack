onSnapshot(collection(db, 'publicProjects'), (snap) => {

  window.renderChart();

function firstName(n) { return (n||'').trim().split(/\s+/)[0] || n; }
function withInitial(n) {
  var parts = (n||'').trim().split(/\s+/);
  if (parts.length < 2) return parts[0] || n;
  return parts[0] + ' ' + parts[1][0] + '.';
}
function colorFor(map, name, palette) {
  if (!map[name]) map[name] = palette[Object.keys(map).length % palette.length];
  return map[name];
}

window.renderChart = function() {
  var PROJECTS = window.PROJECTS || [];
  if (!PROJECTS.length) return;

  var showDm = document.getElementById('chkDm').checked;
  var showPm = document.getElementById('chkPm').checked;
  var showSite = document.getElementById('chkSite').checked;
  var showArch = document.getElementById('chkArch').checked;
  var showStruct = document.getElementById('chkStruct').checked;
  var showMp = document.getElementById('chkMp').checked;
  var showElec = document.getElementById('chkElec').checked;
  var showReviewer = document.getElementById('chkReviewer').checked;
  var showContractors = showArch || showStruct || showMp || showElec;

  var svgEl = document.getElementById('chartSvg');
  svgEl.innerHTML = '';
  var width = svgEl.parentElement.clientWidth || 900;

  var reviewerColors = {}, managerColors = {}, pmColors = {}, siteColors = {}, archColors = {}, structColors = {}, mepColors = {}, elecColors = {};
  var nodesById = {};
  function addNode(id, name, color) {
    if (!nodesById[id]) nodesById[id] = { id: id, name: name, color: color };
    return id;
  }
  var links = [];

  PROJECTS.forEach(function(p) {
    var reviewerColor = colorFor(reviewerColors, p.reviewer, REVIEWER_PALETTE);
    var projectColor = p.color;
    var value = Math.max(p.gba || 1000, 1);
    var projectId = addNode('p:' + p.id, p.name, projectColor);
    nodesById[projectId].logo = p.logo || '';   // the project's own logo, if it has one
    var reviewerId = showReviewer ? addNode('r:' + p.reviewer, firstName(p.reviewer), reviewerColor) : null;
    var preId = projectId, preColor = projectColor;

    if (showDm) {
      var managerColor = colorFor(managerColors, p.manager, MANAGER_PALETTE);
      var managerId = addNode('m:' + p.manager, withInitial(p.manager), managerColor);
      links.push({ source: projectId, target: managerId, value: value, pid: p.id, c1: projectColor, c2: managerColor });
      preId = managerId; preColor = managerColor;
    }

    var pmId = null, pmColor = null;
    if (showPm) {
      pmColor = colorFor(pmColors, p.pm, PM_PALETTE);
      pmId = addNode('pm:' + p.pm, withInitial(p.pm), pmColor);
    }
    // the site managers: the last column, after the project managers (it takes the PM's place when the PM column is off). A project can have
    // several: one node each, and the project's value is shared equally between them (one, or none = "— არავინ": exactly as before).
    var siteTargets = [];
    if (showSite) {
      (p.sites && p.sites.length ? p.sites : ['— არავინ']).forEach(function(siteName) {
        var siteColor = colorFor(siteColors, siteName, SITE_PALETTE);
        siteTargets.push({ id: addNode('sm:' + siteName, withInitial(siteName), siteColor), color: siteColor });
      });
    }
    var tails = pmId ? [{ id: pmId, color: pmColor }] : siteTargets;
    var after = showReviewer ? [{ id: reviewerId, color: reviewerColor }] : tails;
    var linkTo = function(sourceId, sourceColor, targets) { targets.forEach(function(t) { links.push({ source: sourceId, target: t.id, value: value / targets.length, pid: p.id, c1: sourceColor, c2: t.color }); }); };

    if (showContractors) {
      if (showArch) {
        var archColor = colorFor(archColors, p.arch, ARCH_PALETTE);
        var archId = addNode('c:' + p.arch, p.arch, archColor);
        links.push({ source: preId, target: archId, value: value, pid: p.id, c1: preColor, c2: archColor });
        linkTo(archId, archColor, after);
      }
      if (showStruct) {
        var structColor = colorFor(structColors, p.struct, STRUCT_PALETTE);
        var structId = addNode('c:' + p.struct, p.struct, structColor);
        links.push({ source: preId, target: structId, value: value, pid: p.id, c1: preColor, c2: structColor });
        linkTo(structId, structColor, after);
      }
      // mechanical & plumbing and electrical (or the old single MEP contractor of a project not yet moved over)
      var mepList = [];
      if (p.mepOld && !p.mp && !p.elec) { if (showMp || showElec) mepList.push({ name: p.mepOld, kind: 'mep' }); }
      else {
        if (showMp) mepList.push({ name: p.mp || '— MP არ არის', kind: 'mp' });
        if (showElec) mepList.push({ name: p.elec || '— Electrical არ არის', kind: 'elec' });
        if (p.mepOld && (showMp || showElec)) mepList.push({ name: p.mepOld, kind: 'mep' });
      }
      var reviewerLinkedToPm = {};
      mepList.forEach(function(m) {
        var mepColor = m.kind === 'elec' ? colorFor(elecColors, m.name, ELEC_PALETTE) : colorFor(mepColors, m.name, MEP_PALETTE);
        var mepId = addNode('c:' + m.name, m.name, mepColor);
        links.push({ source: preId, target: mepId, value: value, pid: p.id, c1: preColor, c2: mepColor });
        linkTo(mepId, mepColor, after);
        // each MEP contractor is reviewed by its own reviewer; a contractor without one has no reviewer node
        var mepReviewerName = m.kind === 'mp' ? p.mpReviewer : (m.kind === 'elec' ? p.elecReviewer : p.mepReviewerOld);
        if (showReviewer && mepReviewerName) {
          var mepReviewerColor = colorFor(reviewerColors, mepReviewerName, REVIEWER_PALETTE);
          var mepReviewerId = addNode('r:' + mepReviewerName, mepReviewerName, mepReviewerColor);
          links.push({ source: mepId, target: mepReviewerId, value: value, pid: p.id, c1: mepColor, c2: mepReviewerColor });
          if (tails.length && !reviewerLinkedToPm[mepReviewerId]) { linkTo(mepReviewerId, mepReviewerColor, tails); reviewerLinkedToPm[mepReviewerId] = true; }
        }
      });
    } else if (after.length) {
      linkTo(preId, preColor, after);
    }

    if (showReviewer && tails.length) {
      linkTo(reviewerId, reviewerColor, tails);
    }
    if (pmId && siteTargets.length) linkTo(pmId, pmColor, siteTargets);
  });

  var counts = {};
  Object.keys(nodesById).forEach(function(id) {
    var prefix = id.split(':')[0];
    counts[prefix] = (counts[prefix] || 0) + 1;
  });
  var maxCount = Math.max(PROJECTS.length, 1);
  Object.keys(counts).forEach(function(k) { if (counts[k] > maxCount) maxCount = counts[k]; });
  var height = Math.max(200, maxCount * 50);
  // THE LOOK OF THE PROJECTS (as in the app): equal rows, the logo (30 px) on the left, the project names in 14 px
  var narrow = width < 700, rowPitch = narrow ? 40 : 56, logoSize = narrow ? 22 : 30, leftPad = logoSize + 8;
  var projectFont = (narrow ? 12.5 : 14) + 'px';
  height = Math.max(height, 34 + Math.max(PROJECTS.length, 1) * rowPitch + 5);   // room for all the rows

  var svg = d3.select(svgEl).attr('viewBox', [0, 0, width, height]);
  svg.append('rect').attr('x', 0).attr('y', 0).attr('width', width).attr('height', height).attr('fill', '#1a1120');

  var sankeyGen = d3.sankey().nodeId(function(d) { return d.id; }).nodeWidth(14).nodePadding(20)
    .extent([[1 + leftPad, 34], [width - 1, height - 5]]);
  var graph = sankeyGen({
    nodes: Object.keys(nodesById).map(function(k) { return Object.assign({}, nodesById[k]); }),
    links: links.map(function(l) { return Object.assign({}, l); }),
  });
  // The projects stand in equal rows, in the order the layout gave them. A bar is never thicker than its row allows: when the project column decides the
  // scale (e.g. every other box is off) all the bars and flows are thinned by the same factor.
  var projNodes = graph.nodes.filter(function(d) { return d.id.indexOf('p:') === 0; }).sort(function(a, b) { return a.y0 - b.y0; });
  var maxBar = 0; projNodes.forEach(function(d) { maxBar = Math.max(maxBar, d.y1 - d.y0); });
  var barCap = Math.max(4, rowPitch - 10);
  if (maxBar > barCap) {
    var thin = barCap / maxBar;
    graph.links.forEach(function(l) { l.width *= thin; });
    graph.nodes.forEach(function(n) { var c = (n.y0 + n.y1) / 2, h = (n.y1 - n.y0) * thin; n.y0 = c - h / 2; n.y1 = c + h / 2; });
  }
  projNodes.forEach(function(d, i) { var h = d.y1 - d.y0, c = 34 + (i + 0.5) * rowPitch; d.y0 = c - h / 2; d.y1 = c + h / 2; });
  sankeyGen.update(graph);   // the flows follow the bars to their new places

  var defs = svg.append('defs');
  var inkFilter = defs.append('filter').attr('id', 'project-logo-ink').attr('color-interpolation-filters', 'sRGB');   // paints every logo light cream, keeping only its shape
  inkFilter.append('feFlood').attr('flood-color', '#f1eece').attr('result', 'ink');
  inkFilter.append('feComposite').attr('in', 'ink').attr('in2', 'SourceGraphic').attr('operator', 'in');
  graph.links.forEach(function(d, i) {
    var grad = defs.append('linearGradient').attr('id', 'grad' + i).attr('gradientUnits', 'userSpaceOnUse')
      .attr('x1', d.source.x1).attr('x2', d.target.x0);
    grad.append('stop').attr('offset', '0%').attr('stop-color', d.c1);
    grad.append('stop').attr('offset', '100%').attr('stop-color', d.c2);
    d.gradId = 'grad' + i;
  });

  var linkSel = svg.append('g').selectAll('path').data(graph.links).join('path')
    .attr('class', 'sankey-link').attr('d', d3.sankeyLinkHorizontal())
    .attr('fill', 'none').attr('stroke', function(d) { return 'url(#' + d.gradId + ')'; })
    .attr('stroke-width', function(d) { return d.width; }).attr('opacity', 0.45);
  linkSel.append('title').text(function(d) { return d.source.name + ' → ' + d.target.name; });

  function relatedFor(nodeId) {
    var direct = graph.links.filter(function(l) { return l.source.id === nodeId || l.target.id === nodeId; });
    var pids = {};
    direct.forEach(function(l) { pids[l.pid] = true; });
    return graph.links.filter(function(l) { return pids[l.pid]; });
  }

  var node = svg.append('g').selectAll('g').data(graph.nodes).join('g');
  node.append('rect').attr('x', function(d) { return d.x0; }).attr('y', function(d) { return d.y0; })
    .attr('height', function(d) { return Math.max(1, d.y1 - d.y0); }).attr('width', function(d) { return d.x1 - d.x0; })
    .attr('fill', function(d) { return d.color; }).append('title').text(function(d) { return d.name; });
  // The project's logo in its square, left of the project's bar (part of the project's node): no plate, drawn in light cream, only its shape.
  node.filter(function(d) { return d.id.indexOf('p:') === 0; }).each(function(d) {
    var cy = (d.y0 + d.y1) / 2;
    d3.select(this).append('image').attr('class', 'project-logo').attr('href', d.logo || DEFAULT_LOGO).attr('filter', 'url(#project-logo-ink)')
      .attr('x', 1).attr('y', cy - logoSize / 2).attr('width', logoSize).attr('height', logoSize).attr('preserveAspectRatio', 'xMidYMid meet');
  });

  var segA = svg.append('g').selectAll('rect').data(graph.links).join('rect').attr('class', 'sankey-segment')
    .attr('x', function(d) { return d.source.x0; }).attr('y', function(d) { return d.y0 - d.width / 2; })
    .attr('width', function(d) { return d.source.x1 - d.source.x0; }).attr('height', function(d) { return d.width; })
    .attr('fill', function(d) { return d.source.color; });
  var segB = svg.append('g').selectAll('rect').data(graph.links).join('rect').attr('class', 'sankey-segment')
    .attr('x', function(d) { return d.target.x0; }).attr('y', function(d) { return d.y1 - d.width / 2; })
    .attr('width', function(d) { return d.target.x1 - d.target.x0; }).attr('height', function(d) { return d.width; })
    .attr('fill', function(d) { return d.target.color; });

  node.append('text').attr('x', function(d) { return d.x0 < width / 2 ? d.x1 + 6 : d.x0 - 6; })
    .attr('y', function(d) { return (d.y0 + d.y1) / 2; }).attr('dy', '0.35em')
    .attr('text-anchor', function(d) { return d.x0 < width / 2 ? 'start' : 'end'; })
    .attr('fill', 'rgba(255,255,255,.85)').attr('font-size', function(d) { return d.id.indexOf('p:') === 0 ? projectFont : '11px'; })
    .style('font-size', function(d) { return d.id.indexOf('p:') === 0 ? projectFont : null; })
    .attr('font-family', "'Noto Sans Georgian','Inter',sans-serif").text(function(d) { return d.name; });

  node.each(function(d) {
    var el = this;
    el.addEventListener('mouseenter', function() {
      var related = relatedFor(d.id);
      var relatedSet = new Set(related);
      linkSel.attr('opacity', function(l) { return relatedSet.has(l) ? 0.75 : 0.06; });
      segA.attr('opacity', function(l) { return relatedSet.has(l) ? 1 : 0.15; });
      segB.attr('opacity', function(l) { return relatedSet.has(l) ? 1 : 0.15; });
    });
    el.addEventListener('mouseleave', function() {
      linkSel.attr('opacity', 0.45);
      segA.attr('opacity', 1);
      segB.attr('opacity', 1);
    });
  });

  // Vertical drag-to-reorder within a node's own column. Implemented with
  // plain mouse events (not d3.drag()) for reliability.
  function repositionLinksAt(n) {
    var y0 = n.y0;
    (n.sourceLinks || []).forEach(function(l) { l.y0 = y0 + l.width / 2; y0 += l.width; });
    var y1 = n.y0;
    (n.targetLinks || []).forEach(function(l) { l.y1 = y1 + l.width / 2; y1 += l.width; });
  }
  node.style('cursor', 'ns-resize');
  node.each(function(d) {
    var el = this;
    var dragging = false, startClientY = 0, startY0 = 0;
    el.addEventListener('mousedown', function(e) {
      dragging = true;
      startClientY = e.clientY;
      startY0 = d.y0;
      e.preventDefault();
    });
    window.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      var scale = height / (svgEl.getBoundingClientRect().height || height);
      var h = d.y1 - d.y0;
      d.y0 = Math.max(0, Math.min(height - h, startY0 + (e.clientY - startClientY) * scale));
      d.y1 = d.y0 + h;
      d3.select(el).select('rect').attr('y', d.y0);
      d3.select(el).select('text').attr('y', (d.y0 + d.y1) / 2);
      d3.select(el).select('image.project-logo').attr('y', (d.y0 + d.y1) / 2 - logoSize / 2);   // a project's logo moves with its bar
      repositionLinksAt(d);
      linkSel.attr('d', d3.sankeyLinkHorizontal());
      segA.attr('y', function(l) { return l.y0 - l.width / 2; });
      segB.attr('y', function(l) { return l.y1 - l.width / 2; });
    });
    window.addEventListener('mouseup', function() { dragging = false; });
  });

  function colCenterX(prefix) {
    var n = graph.nodes.filter(function(nd) { return nd.id.indexOf(prefix) === 0; })[0];
    return n ? (n.x0 + n.x1) / 2 : 0;
  }
  function header(x, anchor, text) {
    svg.append('text').attr('x', x).attr('y', 20).attr('text-anchor', anchor)
      .attr('fill', 'rgba(255,255,255,.5)').attr('font-size', '11px')
      .attr('font-family', "'Noto Sans Georgian','Inter',sans-serif").text(text);
  }
  header(1, 'start', 'პროექტი');
  var showSite2 = document.getElementById('chkSite').checked;
  var dmIsLast = showDm && !showContractors && !showReviewer && !showPm && !showSite2;
  if (showDm) header(dmIsLast ? width - 1 : colCenterX('m:'), dmIsLast ? 'end' : 'middle', 'დიზაინ მენეჯერი');
  if (showContractors) {
    var activeDisciplines = [showArch && 'არქიტექტორი', showStruct && 'კონსტრუქტორი', showMp && 'MP', showElec && 'Electrical'].filter(Boolean);
    var contractorIsLast = !showReviewer && !showPm && !showSite2;
    var label = activeDisciplines.length === 1 ? activeDisciplines[0] : 'კონტრაქტორი';
    header(contractorIsLast ? width - 1 : colCenterX('c:'), contractorIsLast ? 'end' : 'middle', label);
  }
  if (showReviewer) header((showPm || showSite2) ? colCenterX('r:') : width - 1, (showPm || showSite2) ? 'middle' : 'end', 'რევიზორი');
  if (showPm) header(showSite2 ? colCenterX('pm:') : width - 1, showSite2 ? 'middle' : 'end', 'პროექტის მენეჯერი');
  if (showSite2) header(width - 1, 'end', 'საიტ მენეჯერი');
};

['chkDm','chkPm','chkSite','chkArch','chkStruct','chkMp','chkElec','chkReviewer'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', window.renderChart);
});
// The "all" box: switches every box on or off at once; it follows the others (ticked = all on, a bar = some, empty = none).
var allBoxIds = ['chkDm','chkPm','chkSite','chkArch','chkStruct','chkMp','chkElec','chkReviewer'];
function syncAllBox() {
  var on = 0; allBoxIds.forEach(function(id) { if (document.getElementById(id).checked) on++; });
  var all = document.getElementById('chkAll');
  all.checked = on === allBoxIds.length;
  all.indeterminate = on > 0 && on < allBoxIds.length;
}
document.getElementById('chkAll').addEventListener('change', function() {
  var on = this.checked;
  allBoxIds.forEach(function(id) { document.getElementById(id).checked = on; });
  syncAllBox();
  window.renderChart();
});
allBoxIds.forEach(function(id) { document.getElementById(id).addEventListener('change', syncAllBox); });
syncAllBox();
window.addEventListener('resize', window.renderChart);
</script>
</body>
